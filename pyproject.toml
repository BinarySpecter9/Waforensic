[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waforensic"
version = "0.1.4"
description = "Android & WhatsApp forensic recovery toolkit (offline, private)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography", "pillow"]
authors = [{name = "BinarySpecter9"}]

[project.scripts]
waforensic = "waforensic.cli:main"

[tool.setuptools.packages.find]
include = ["waforensic*"]
